backend:
  name: github
  repo: AbuGhazie/ahmad-alarag
  branch: main
media_folder: "images"
public_folder: "/images"
collections:
  - name: "posts"
  label: "المقالات"
  folder: "_posts"
  create: true
  fields:
    - {name: "path", label: "مسار النشر"}
    - {name: "layout", label: "التخطيط", default: "post"}
    - {name: "title", label: "العنوان"}
    - {name: "date", label: "التاريخ", widget: "datetime"}
    - {name: "body", label: "المحتوى", widget: "markdown"}
    
