backend:
  name: github
  repo: AbuGhazie/ahmad-alarag
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "المقالات"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "العنوان", name: "title", widget: "string"}
      - {label: "تاريخ النشر", name: "date", widget: "datetime"}
      - {label: "المحتوى", name: "body", widget: "markdown"}
