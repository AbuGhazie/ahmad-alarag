backend:
  name: turbo-github
  turbo_site_id: 42bc6cc2-08bf-44de-b1a9-6cf8747f9392
  branch: cms-test

locale: ar

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "site_data"
    label: "محتوى الموقع"
    files:
      - name: "articles"
        label: "المقالات والكتابات"
        file: "data/articles.json"
        fields:
          - label: "المقالات"
            name: "articles"
            widget: "list"
            fields:
              - { label: "عنوان المقال", name: "title", widget: "string" }
              - { label: "نبذة عن المقال", name: "summary", widget: "text" }
              - { label: "رابط المقال", name: "url", widget: "string" }
              - { label: "صورة المقال", name: "image", widget: "image", required: false }

      - name: "books"
        label: "الكتب والمؤلفات"
        file: "data/books.json"
        fields:
          - label: "الكتب"
            name: "books"
            widget: "list"
            fields:
              - { label: "عنوان الكتاب", name: "title", widget: "string" }
              - { label: "نبذة عن الكتاب", name: "summary", widget: "text" }
              - { label: "رابط الكتاب", name: "url", widget: "string", required: false }
              - { label: "غلاف الكتاب", name: "image", widget: "image", required: false }

      - name: "media"
        label: "الأعمال الإعلامية"
        file: "data/media.json"
        fields:
          - label: "المواد الإعلامية"
            name: "media"
            widget: "list"
            fields:
              - { label: "عنوان المادة", name: "title", widget: "string" }
              - { label: "وصف المادة", name: "summary", widget: "text", required: false }
              - { label: "رابط المادة", name: "url", widget: "string" }
              - { label: "صورة المادة", name: "image", widget: "image", required: false }
              
